name: Deploy public site to GitHub Pages

# Triggers whenever the backend's publish pipeline commits updated
# public-data/*.json, and also manually via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "public-data/**"
      - "public/**"
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate public data
        run: node scripts/validate-public-data.mjs

      - name: Build static site
        run: npm run build
        env:
          # Vite reads this at build time to bake the correct base path
          # for a GitHub Pages project site.
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/test/' }}

          # Used only to build sitemap.xml with absolute URLs.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || '' }}

          # Optional anonymous analytics endpoint.
          # The public site does not require the backend to render.
          VITE_API_URL: ${{ vars.API_URL || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Use a unique artifact name so it cannot collide with another
          # GitHub Pages artifact named "github-pages".
          name: public-site-pages
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: public-site-pages
