name: Test 3D assets via GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="3d-assets-test-${{ github.run_number }}"

          gh release create "$TAG" \
            "public/public-assets/products/cmu9n8pih0027lvy5a71k2kvl/models/vxfGt70xEyQ4xcj1.glb" \
            "public/public-assets/products/cmu9n8pih0027lvy5a71k2kvl/models/-RzPdyLOnOR2bWBo.usdz" \
            --repo "${{ github.repository }}" \
            --title "3D Assets Test #${{ github.run_number }}" \
            --notes "Temporary test release for GLB/USDZ delivery."

      - name: Switch test product to Release URLs
        run: |
          TAG="3d-assets-test-${{ github.run_number }}"

          export GLB_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/vxfGt70xEyQ4xcj1.glb"
          export USDZ_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/-RzPdyLOnOR2bWBo.usdz"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("public-data/products.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          product = next(
              p for p in data
              if p.get("id") == "cmu9n8pih0027lvy5a71k2kvl"
          )

          urls = {
              "GLB": os.environ["GLB_URL"],
              "USDZ": os.environ["USDZ_URL"],
          }

          for model in product.get("models", []):
              if model.get("kind") in urls:
                  model["url"] = urls[model["kind"]]

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit Release URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public-data/products.json

          git commit -m "Test 3D assets from GitHub Release" || exit 0

          git push
